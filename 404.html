<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <title>Redirecting to pinktalk.online</title>
  </head>

    <p>Redirecting to pinktalk.online.</p>
    <script>

      window.location.replace(target);
    </script>
